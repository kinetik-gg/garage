# Palette variables come from the generated include below.
source = ~/.local/state/garage/generated/hyprlock-theme.conf
# garage-lock-session rewrites this before each invocation. An empty value is
# Hyprlock's documented all-monitor fallback when compositor discovery fails.
source = ~/.local/state/garage/generated/hyprlock-monitor.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
}

background {
    monitor =
    path = ~/.local/share/wallpaper/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.42
}

shape {
    monitor = $auth_monitor
    size = 384, 210
    color = $lock_card_color
    rounding = 22
    border_size = 1
    border_color = $lock_card_border
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(00000066)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = $auth_monitor
    text = Unlock
    color = $font_color
    font_size = 22
    font_family = Plus Jakarta Sans
    position = 0, 58
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor = $auth_monitor
    size = 320, 44
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.30
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    fade_on_empty = false
    placeholder_text = <span foreground="##$placeholder_hex">Password</span>
    check_text = Authenticating…
    fail_text = $FAIL
    check_color = $check_color
    fail_color = $fail_color
    font_family = Plus Jakarta Sans
    rounding = 12
    position = 0, -35
    halign = center
    valign = center
    zindex = 2
}
