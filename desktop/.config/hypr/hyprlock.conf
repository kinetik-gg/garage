# Palette variables come from the generated include below.
source = ~/.local/state/garage/generated/hyprlock-theme.conf
# garage-lock-session rewrites this before each invocation. An empty value is
# Hyprlock's documented all-monitor fallback when compositor discovery fails.
source = ~/.local/state/garage/generated/hyprlock-monitor.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
    fractional_scaling = 1
}

background {
    monitor =
    path = ~/.local/share/wallpaper/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.42
}

input-field {
    monitor = $auth_monitor
    size = $auth_width, $auth_height
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.30
    inner_color = rgba(00000000)
    font_color = $font_color
    fade_on_empty = false
    placeholder_text = <span foreground="##$placeholder_hex">Type your password...</span>
    check_text = <span foreground="##$check_hex">Authenticating…</span>
    fail_text = <span foreground="##$fail_hex">$FAIL</span>
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_family = Plus Jakarta Sans
    rounding = 12
    position = 0, 0
    halign = center
    valign = center
}
