# Palette variables come from the generated include below.
source = ~/.local/state/garage/generated/hyprlock-theme.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
}

background {
    monitor =
    path = ~/.local/share/wallpaper/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.42
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.30
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    fade_on_empty = false
    placeholder_text = <span foreground="##$placeholder_hex">Password</span>
    check_color = $check_color
    fail_color = $fail_color
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 48
    font_family = IBM Plex Sans
    position = 0, 90
    halign = center
    valign = center
}
