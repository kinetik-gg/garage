[Service]
# modules-left lives only in the generated fragment, so the bar's left side is
# empty if waybar starts before the first render. Hyprland's autostart does not
# wait for it -- hl.exec_cmd is fire-and-forget -- so the unit renders its own
# fragments first. Narrow on purpose: a full render re-themes every toolkit.
# Leading `-`: a failed render must degrade the theme, never disable the bar.
ExecStartPre=-%h/.local/bin/garage render-bar
