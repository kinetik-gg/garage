[Service]
# Narrow on purpose: hypridle reads one generated file and this renders exactly
# that one. It used to run `garage render`, which applied as well as rendered --
# so changing a lock timeout, which restarts this unit, re-themed every toolkit
# and pushed gsettings, and session start applied the whole theme twice (once
# here, once from the `garage apply` in autostart.lua).
# Leading `-`: a failed render must degrade the theme, never disable the locker.
ExecStartPre=-%h/.local/bin/garage render-idle
ExecStart=
ExecStart=/usr/bin/hypridle --config %h/.local/state/garage/generated/hypridle.conf
