name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Replaces the former repository format, lint, and test runner for Rust.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all --check

      - name: Lint
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: backend
        run: cargo test --workspace --all-targets

  # Replaces the former installer syntax and numbered-stage shape checks.
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check shell syntax
        run: bash -n bootstrap.sh install.sh install/lib.sh install/[0-9][0-9]-*.sh

      - name: Check graphical user-unit ordering
        shell: bash
        run: |
          set -euo pipefail
          if grep -H -E '^After=.*graphical-session\.target' desktop/.config/systemd/user/*.path; then
            echo "User path units are implicitly Before=paths.target; ordering one after graphical-session.target creates a cycle through basic.target." >&2
            exit 1
          fi

          for timer in desktop/.config/systemd/user/*.timer; do
            trigger=$(sed -n 's/^Unit=//p' "$timer")
            [[ -n $trigger ]] || trigger="$(basename "${timer%.timer}").service"
            trigger_path="desktop/.config/systemd/user/$trigger"
            [[ -f $trigger_path ]] || continue

            while IFS='=' read -r directive dependencies; do
              [[ $directive == Wants || $directive == Requires ]] || continue
              for dependency in $dependencies; do
                if awk -v unit="$dependency" \
                  '$1 == unit && $1 !~ /\.timer$/ { found = 1 } END { exit !found }' \
                  system/manifest/units.list; then
                  echo "$trigger_path: timer-triggered services must not pull managed graphical unit $dependency." >&2
                  exit 1
                fi
              done
            done <"$trigger_path"
          done

      - name: Check the numbered install stages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          stages=(install/[0-9][0-9]-*.sh)
          if ((${#stages[@]} == 0)); then
            echo "No numbered install stages were found." >&2
            exit 1
          fi

          for index in "${!stages[@]}"; do
            expected=$(printf '%02d' "$((index + 1))")
            filename=${stages[$index]##*/}
            actual=${filename%%-*}
            if [[ $actual != "$expected" ]]; then
              echo "Install stages are not contiguous: expected $expected, found $actual ($filename)." >&2
              exit 1
            fi
          done

          expected_guard='if ((${#stages[@]} < '"${#stages[@]}"')); then'
          grep -Fqx 'stages=("$repo_dir"/install/[0-9][0-9]-*.sh)' bootstrap.sh
          grep -Fqx "$expected_guard" bootstrap.sh
          grep -Fq 'for stage in "${stages[@]}"; do' bootstrap.sh
          grep -Fq 'source "$stage"' bootstrap.sh
          echo "Stage inventory is contiguous at ${#stages[@]} files, and bootstrap sources it."

  # Replaces the former install-table and documentation-citation drift checks.
  repo-sync:
    name: Repository sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the install table against the stage files
        shell: bash
        run: |
          set -euo pipefail
          sync_dir=$(mktemp -d)
          trap 'rm -r -- "$sync_dir"' EXIT
          documented_all="$sync_dir/documented-all"
          documented="$sync_dir/documented"
          on_disk="$sync_dir/on-disk"

          mapfile -t table_rows < <(
            sed -n '/^## What bootstrap does$/,/^## /p' docs/INSTALL.md |
              grep -E '^\|[[:space:]]*[0-9]+[[:space:]]*\|'
          )
          if ((${#table_rows[@]} == 0)); then
            echo "The 'What bootstrap does' table has no numbered rows." >&2
            exit 1
          fi

          for row in "${table_rows[@]}"; do
            file=$(sed -E 's/^.*\|[[:space:]]*`([^`]+)`[[:space:]]*\|[[:space:]]*$/\1/' <<<"$row")
            if [[ $file == "$row" ]]; then
              echo "Malformed File cell in install table row: $row" >&2
              exit 1
            fi
            printf '%s\n' "$file"
          done | sort -u >"$documented_all"

          if ! grep -Fxq 'bootstrap.sh' "$documented_all"; then
            echo "The install table does not include its bootstrap.sh summary row." >&2
            exit 1
          fi
          grep -Fvx 'bootstrap.sh' "$documented_all" >"$documented"
          ls install/[0-9][0-9]-*.sh | sort -u >"$on_disk"

          missing_from_docs=$(comm -23 "$on_disk" "$documented")
          missing_from_disk=$(comm -13 "$on_disk" "$documented")
          if [[ -n $missing_from_docs || -n $missing_from_disk ]]; then
            if [[ -n $missing_from_docs ]]; then
              echo "Install stage files missing from docs/INSTALL.md:" >&2
              sed 's/^/  - /' <<<"$missing_from_docs" >&2
            fi
            if [[ -n $missing_from_disk ]]; then
              echo "Install table entries with no stage file:" >&2
              sed 's/^/  - /' <<<"$missing_from_disk" >&2
            fi
            exit 1
          fi

          echo "Install table and disk agree on $(wc -l <"$on_disk") numbered stages."

      - name: Check documentation citations
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          function_count=0
          constant_count=0
          lua_count=0

          if grep -rnE 'garage:[0-9]+' docs; then
            echo "Raw garage line-number citations are forbidden; cite a symbol instead." >&2
            failures=1
          fi

          for document in docs/*.md; do
            while IFS= read -r citation; do
              [[ -n $citation ]] || continue
              function_count=$((function_count + 1))
              name=${citation:1:${#citation}-4}
              if grep -rqE --include='*.rs' "fn[[:space:]]+$name([^[:alnum:]_]|$)" backend/crates; then
                continue
              fi

              lua_home=
              case $name in
                dofile)
                  continue
                  ;;
                bind)
                  lua_home=desktop/.config/hypr/config/binds.lua
                  ;;
                load_plugin | load_override)
                  lua_home=desktop/.config/hypr/hyprland.lua
                  ;;
              esac
              if [[ -n $lua_home ]] &&
                grep -qE "^(local[[:space:]]+)?function[[:space:]]+$name([^[:alnum:]_]|$)" "$lua_home"; then
                continue
              fi

              echo "$document: $citation resolves to no Rust or allowlisted Lua function." >&2
              failures=1
            done < <(grep -oE '`[a-z_][a-zA-Z0-9_]*\(\)`' "$document" | sort -u || true)
          done

          while IFS= read -r citation; do
            [[ -n $citation ]] || continue
            constant_count=$((constant_count + 1))
            name=${citation:1:${#citation}-2}
            if grep -rqE --include='*.rs' "const[[:space:]]+$name([^[:alnum:]_]|$)" backend/crates; then
              continue
            fi

            lua_home=
            case $name in
              GLASS_AVAILABLE | HYPREXPO_AVAILABLE)
                lua_home=desktop/.config/hypr/hyprland.lua
                ;;
              RESCUE)
                lua_home=desktop/.config/hypr/config/binds.lua
                ;;
            esac
            if [[ -n $lua_home ]] &&
              grep -qE "^(local[[:space:]]+)?$name[[:space:]]*=" "$lua_home"; then
              continue
            fi

            echo "docs/ARCHITECTURE.md: $citation resolves to no Rust or allowlisted Lua constant." >&2
            failures=1
          done < <(grep -oE '`[A-Z][A-Z0-9_]{2,}`' docs/ARCHITECTURE.md | sort -u || true)

          citation_pattern='`[[:alnum:]_./-]+\.lua:[0-9]+`-`[0-9]+`|`[[:alnum:]_./-]+\.lua:[0-9]+-[0-9]+`|`[[:alnum:]_./-]+\.lua:[0-9]+`'
          for document in docs/*.md; do
            while IFS= read -r citation; do
              [[ -n $citation ]] || continue
              lua_count=$((lua_count + 1))
              plain=${citation//\`/}
              cited=${plain%%:*}
              range=${plain#*:}
              start=${range%%-*}
              if [[ $range == *-* ]]; then
                end=${range##*-}
              else
                end=$start
              fi

              targets=()
              while IFS= read -r lua_file; do
                if [[ ${lua_file##*/} == "$cited" || $lua_file == */"$cited" ]]; then
                  targets+=("$lua_file")
                fi
              done < <(find desktop/.config/hypr -type f -name '*.lua' -print | sort)

              if ((${#targets[@]} != 1)); then
                echo "$document: $citation resolves to ${#targets[@]} Lua files, expected exactly one." >&2
                failures=1
                continue
              fi

              line_count=$(wc -l <"${targets[0]}")
              if ((start < 1 || end < start || end > line_count)); then
                echo "$document: $citation is outside ${targets[0]} (1-$line_count)." >&2
                failures=1
              fi
            done < <(grep -oE "$citation_pattern" "$document" || true)
          done

          if ((failures != 0)); then
            exit 1
          fi
          echo "Documentation citations resolve ($function_count functions, $constant_count constants, $lua_count Lua locations)."
