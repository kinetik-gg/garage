[package]
name = "garage-metrics"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "garage-metrics"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
garage-core = { path = "../garage-core" }
# The one thing outside the standard library and this workspace: flock, which has no
# safe wrapper in std and which `unsafe_code = "forbid"` puts out of reach otherwise.
rustix = { version = "1.1.4", features = ["fs"] }
thiserror = "2.0.20"
