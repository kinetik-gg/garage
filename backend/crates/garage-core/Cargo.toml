[package]
name = "garage-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "garage_core"

[lints]
workspace = true

[dependencies]
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
