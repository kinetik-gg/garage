[package]
name = "garage-apply"
version = "0.1.0"
edition = "2021"

[lib]
name = "garage_apply"

[lints]
workspace = true

[dependencies]
garage-core = { path = "../garage-core" }
garage-prefs = { path = "../garage-prefs" }
garage-proc = { path = "../garage-proc" }
garage-render = { path = "../garage-render" }
serde = { version = "1.0.229", features = ["derive"] }
# `hyprctl clients -j` and `hyprctl monitors -j` are read straight from the appliers that
# need them, through the local `json_command()` equivalent in `crate::workspaces` -- see that
# module's doc for why the conflate-every-failure-to-empty reading belongs there rather than
# behind `garage-proc`'s stricter `MonitorSource`.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
# `DISPLAY_LOCK`: the advisory lock the display transaction is held across, which is `flock`
# and has no safe wrapper in std. The same crate and the same feature `garage-prefs` takes
# `PREFERENCES_LOCK` from.
rustix = { version = "1.1.4", features = ["fs"] }
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["preserve_order"] }
