[package]
name = "garage-file-index"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "garage-file-index"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
garage-core = { path = "../garage-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
thiserror = "2.0.20"
toml = "1.1.4"
